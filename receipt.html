{% extends "base.html" %}
{% block title %}Receipt · Taskmill{% endblock %}
{% block content %}
<style>
  .dx-page { max-width: 28rem; margin: 0 auto; padding: 1rem 0.85rem 6rem; }
  .dx-card {
    background: linear-gradient(165deg, rgba(30,41,59,.96), rgba(10,14,24,.99));
    border: 1px solid rgba(255,255,255,.12); border-radius: 1.5rem;
    box-shadow: 0 28px 70px -34px rgba(0,0,0,.9); position: relative; overflow: hidden;
  }
  .dx-card::before {
    content:""; position:absolute; inset:0; border-radius:inherit; padding:1px; pointer-events:none;
    background: linear-gradient(135deg, rgba(255,255,255,.45), rgba(186,230,253,.2));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
  }
  .dx-card > * { position: relative; z-index: 1; }
</style>
<div class="dx-page">
  <section class="dx-card p-6 text-center">
    <p class="text-[10px] uppercase tracking-[0.2em] text-sky-200/80 font-bold">Receipt</p>
    <h1 class="text-2xl font-black mt-2">{{ title|default('Transaction') }}</h1>
    <p class="text-3xl font-black mt-4 text-white">{{ money(current_user, amount|default(0)) }}</p>
    <p class="text-sm text-zinc-400 mt-2">{{ subtitle|default('') }}</p>
    <p class="text-xs text-zinc-500 mt-4">{{ ref|default('') }}</p>
    <a href="{{ url_for('wallet.index') }}" class="inline-flex mt-6 rounded-xl bg-gradient-to-r from-white to-sky-100 text-zinc-900 font-bold px-5 py-2.5 text-sm">Back to wallet</a>
  </section>
</div>
{% endblock %}
