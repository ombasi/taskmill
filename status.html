{% extends "base.html" %}
{% block title %}System status · Taskmill{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto px-4 py-10 space-y-4">
  <h1 class="text-2xl font-black">System status</h1>
  <div class="space-y-2">
    {% for label, val in items %}
    <div class="flex justify-between rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-sm">
      <span>{{ label }}</span>
      <span class="font-bold {% if val == 'Normal' %}text-emerald-300{% else %}text-amber-200{% endif %}">{{ val }}</span>
    </div>
    {% endfor %}
  </div>
  <p class="text-xs text-zinc-500">Updated for transparency. Personal balances are never shown here.</p>
</div>
{% endblock %}
