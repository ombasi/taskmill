
<div class="flex flex-wrap gap-1.5 mb-2" id="ticket-reasons">
  {% for label, text in [
    ('Deposit', 'Where is my deposit? Ref: '),
    ('Withdraw', 'I need help with my withdrawal. '),
    ('Combo', 'I have a combo hold and need guidance. '),
    ('Login', 'I cannot log in / need password help. ')
  ] %}
  <button type="button" class="rounded-full border border-white/15 px-2.5 py-1 text-[10px] font-bold text-zinc-300"
    onclick="var m=document.querySelector('[name=message],#message,textarea'); if(m){ m.value='{{ text }}'; m.focus(); }">{{ label }}</button>
  {% endfor %}
</div>
