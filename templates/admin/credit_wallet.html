<div id="creditModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center">

<form id="creditForm" method="POST"
      class="bg-slate-900 p-6 rounded-xl w-96">

<h2 class="text-xl font-bold mb-4">Credit Wallet</h2>

<input
    type="number"
    step="0.01"
    name="amount"
    placeholder="Amount"
    class="w-full bg-slate-800 p-3 rounded">

<div class="flex justify-end gap-3 mt-5">

<button type="button"
onclick="closeCreditModal()"
class="px-5 py-2 bg-gray-600 rounded">

Cancel

</button>

<button class="px-5 py-2 bg-green-600 rounded">

Credit

</button>

</div>

</form>

</div>
