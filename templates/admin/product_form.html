{% extends "admin/base.html" %}

{% if product %}
    {% set page = "Edit Product" %}
{% else %}
    {% set page = "Create Product" %}
{% endif %}

{% block title %}{{ page }}{% endblock %}
{% block page_title %}{{ page }}{% endblock %}

{% block content %}

<div class="max-w-5xl mx-auto">

    <div class="glass rounded-3xl p-10">

        <form method="POST" class="space-y-8">

            <div class="grid md:grid-cols-2 gap-6">

                <!-- Product Name -->

                <div>

                    <label class="block mb-2 font-semibold">

                        Product Name

                    </label>

                    <input
                        type="text"
                        name="name"
                        required
                        value="{{ product.name if product else '' }}"
                        class="w-full bg-slate-800 rounded-xl px-4 py-3">

                </div>

                <!-- Category -->

                <div>

                    <label class="block mb-2 font-semibold">

                        Category

                    </label>

                    <input
                        type="text"
                        name="category"
                        value="{{ product.category if product else '' }}"
                        class="w-full bg-slate-800 rounded-xl px-4 py-3">

                </div>

                <!-- Partner -->

                <div>

                    <label class="block mb-2 font-semibold">

                        Partner

                    </label>

                    <select
                        name="partner_id"
                        class="w-full bg-slate-800 rounded-xl px-4 py-3">

                        <option value="">Select Partner</option>

                        {% for partner in partners %}

                        <option
                            value="{{ partner.id }}"
                            {% if product and product.partner_id == partner.id %}
                            selected
                            {% endif %}>

                            {{ partner.name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <!-- Price -->

                <div>

                    <label class="block mb-2 font-semibold">

                        Product Price

                    </label>

                    <input
                        type="number"
                        step="0.01"
                        name="price"
                        required
                        value="{{ product.price if product else '' }}"
                        class="w-full bg-slate-800 rounded-xl px-4 py-3">

                </div>

                <!-- Commission -->

                <div>

                    <label class="block mb-2 font-semibold">

                        Commission

                    </label>

                    <input
                        type="number"
                        step="0.01"
                        name="commission"
                        required
                        value="{{ product.commission if product else '' }}"
                        class="w-full bg-slate-800 rounded-xl px-4 py-3">

                </div>

                <!-- Stock -->

                <div>

                    <label class="block mb-2 font-semibold">

                        Stock

                    </label>

                    <input
                        type="number"
                        name="stock"
                        required
                        value="{{ product.stock if product else 999999 }}"
                        class="w-full bg-slate-800 rounded-xl px-4 py-3">

                </div>

            </div>

            <!-- Image -->

            <div>

                <label class="block mb-2 font-semibold">

                    Product Image URL

                </label>

                <input
                    type="text"
                    name="image"
                    value="{{ product.image if product else '' }}"
                    class="w-full bg-slate-800 rounded-xl px-4 py-3">

            </div>

            <!-- Description -->

            <div>

                <label class="block mb-2 font-semibold">

                    Description

                </label>

                <textarea
                    rows="6"
                    name="description"
                    class="w-full bg-slate-800 rounded-xl px-4 py-3">{{ product.description if product else '' }}</textarea>

            </div>

            <!-- Buttons -->

            <div class="flex gap-4">

                <button
                    class="bg-indigo-600 px-8 py-3 rounded-xl hover:bg-indigo-700">

                    <i class="fa fa-save mr-2"></i>

                    Save Product

                </button>

                <a
                    href="{{ url_for('admin.products') }}"
                    class="bg-slate-700 px-8 py-3 rounded-xl">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
