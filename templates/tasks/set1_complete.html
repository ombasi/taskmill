{% extends "base.html" %}
{% block title %}Set 1 complete{% endblock %}
{% block content %}
<style>
  .s1 { max-width: 22rem; margin: 0 auto; padding: 1.25rem 0.9rem 6rem; }
  .s1-card {
    border-radius: 1.6rem; border: 1px solid rgba(255,255,255,.12);
    background:
      radial-gradient(ellipse at 40% 0%, rgba(52,211,153,.2), transparent 55%),
      linear-gradient(165deg, rgba(24,32,48,.98), rgba(8,10,18,.99));
    box-shadow: 0 24px 50px -28px rgba(0,0,0,.92);
    padding: 1.75rem 1.25rem;
    text-align: center;
  }
  .s1-title {
    background: linear-gradient(120deg, #fff, #a7f3d0 50%, #e0f2fe);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .s1-btn {
    display: flex; align-items: center; justify-content: center; gap: 0.45rem;
    width: 100%; padding: 0.85rem 1rem; border-radius: 0.95rem;
    font-size: 0.875rem; font-weight: 800; text-decoration: none;
  }
  .s1-primary {
    color: #04110a;
    background: linear-gradient(135deg, #6ee7b7, #34d399);
    box-shadow: 0 10px 24px -10px rgba(52,211,153,.5);
  }
  .s1-ghost {
    color: #e2e8f0; border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.04);
  }
</style>

<div class="s1">
  <div class="s1-card">
    <div class="mx-auto w-12 h-12 rounded-2xl bg-emerald-500/20 border border-emerald-400/25 grid place-items-center text-emerald-300 text-xl mb-3">
      <i class="fa-solid fa-check"></i>
    </div>
    <p class="text-[10px] font-extrabold uppercase tracking-[0.2em] text-emerald-200/80">Set 1 done</p>
    <h1 class="text-xl font-black s1-title mt-1.5">Nice work</h1>
    <p class="text-sm text-zinc-400 mt-2 leading-relaxed">
      To unlock <strong class="text-zinc-200">Set 2</strong>, message support once. They reset your second set so you can continue earning today.
    </p>
    <div class="mt-5 space-y-2">
      <a href="{{ url_for('dashboard.contact') }}" class="s1-btn s1-primary" aria-label="Contact support for Set 2">
        <i class="fa-solid fa-headset"></i> Contact support
      </a>
      <a href="{{ url_for('dashboard.index') }}" class="s1-btn s1-ghost" aria-label="Back to home">Home</a>
    </div>
  </div>
</div>
{% endblock %}
