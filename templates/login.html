{% extends "base.html" %}

{% block title %}Login - Taskmill{% endblock %}

{% block content %}

<div class="relative min-h-screen flex items-center justify-center overflow-hidden bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-900">

    <!-- Background -->
    <div class="absolute inset-0">
        <div class="absolute -top-40 -left-32 w-96 h-96 bg-indigo-600/30 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-0 right-0 w-[500px] h-[500px] bg-purple-600/20 rounded-full blur-[140px]"></div>

        <div class="absolute inset-0 opacity-[0.04]"
             style="background-image:linear-gradient(rgba(255,255,255,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.2) 1px,transparent 1px);background-size:40px 40px;">
        </div>
    </div>

    <!-- Login Card -->
    <div class="relative z-10 w-full max-w-md px-6">

        <div class="glass rounded-[34px] p-10">

            <!-- Logo -->

            <div class="text-center mb-10">

                <div class="mx-auto w-24 h-24 rounded-3xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-2xl shadow-indigo-600/40">

                    <i class="fa-solid fa-layer-group text-4xl text-white"></i>

                </div>

                <h1 class="text-5xl font-black mt-6 bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">
                    TASKMILL
                </h1>

                <p class="text-zinc-400 mt-3">
                    Welcome back. Continue earning today.
                </p>

            </div>

            <!-- Form -->

            <form method="POST" class="space-y-6">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div>

                    <label class="block text-sm mb-2 text-zinc-300">
                        Username / Email
                    </label>

                    <div class="relative">

                        <i class="fa-solid fa-user absolute left-5 top-1/2 -translate-y-1/2 text-zinc-500"></i>

                        <input
                            type="text"
                            name="username"
                            required
                            placeholder="Enter username"
                            class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 pl-14 pr-4 text-white placeholder:text-zinc-500 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 outline-none transition">

                    </div>

                </div>

                <div>

                    <label class="block text-sm mb-2 text-zinc-300">
                        Password
                    </label>

                    <div class="relative">

                        <i class="fa-solid fa-lock absolute left-5 top-1/2 -translate-y-1/2 text-zinc-500"></i>

                        <input
                            id="password"
                            type="password"
                            name="password"
                            required
                            placeholder="••••••••"
                            class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 pl-14 pr-14 text-white placeholder:text-zinc-500 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 outline-none transition">

                        <button
                            type="button"
                            onclick="togglePassword()"
                            class="absolute right-5 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-white">

                            <i id="eye" class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>

                <div class="flex justify-between items-center">

                    <label class="flex items-center gap-2 text-sm text-zinc-400">

                        <input type="checkbox">

                        Remember me

                    </label>

                    <a href="/contact"
                       class="text-indigo-400 hover:text-indigo-300 text-sm">

                        Forgot Password?

                    </a>

                </div>

                <button
                    class="w-full rounded-2xl py-4 font-bold text-lg bg-gradient-to-r from-indigo-600 to-purple-600 hover:scale-[1.02] hover:shadow-xl hover:shadow-indigo-600/40 transition">

                    Login

                </button>

            </form>

            <!-- Divider -->

            <div class="flex items-center my-8">

                <div class="flex-1 border-t border-white/10"></div>

                <span class="px-4 text-zinc-500 text-sm">

                    Secure Access

                </span>

                <div class="flex-1 border-t border-white/10"></div>

            </div>

            <!-- Features -->

            <div class="grid grid-cols-3 gap-4 text-center mb-8">

                <div>

                    <div class="w-12 h-12 mx-auto rounded-xl bg-indigo-500/20 flex items-center justify-center">

                        <i class="fa-solid fa-wallet text-indigo-400"></i>

                    </div>

                    <p class="text-xs mt-2 text-zinc-400">
                        Wallet
                    </p>

                </div>

                <div>

                    <div class="w-12 h-12 mx-auto rounded-xl bg-purple-500/20 flex items-center justify-center">

                        <i class="fa-solid fa-list-check text-purple-400"></i>

                    </div>

                    <p class="text-xs mt-2 text-zinc-400">
                        Tasks
                    </p>

                </div>

                <div>

                    <div class="w-12 h-12 mx-auto rounded-xl bg-green-500/20 flex items-center justify-center">

                        <i class="fa-solid fa-money-bill-trend-up text-green-400"></i>

                    </div>

                    <p class="text-xs mt-2 text-zinc-400">
                        Earnings
                    </p>

                </div>

            </div>

            <!-- Register -->

            <div class="text-center">

                <p class="text-zinc-400">

                    Don't have an account?

                    <a href="{{ url_for('auth.register') }}"
                       class="text-indigo-400 hover:text-indigo-300 font-semibold">

                        Create Account

                    </a>

                </p>

            </div>

        </div>

    </div>

</div>

<script>

function togglePassword(){

    const input=document.getElementById("password");
    const eye=document.getElementById("eye");

    if(input.type==="password"){

        input.type="text";
        eye.className="fa-solid fa-eye-slash";

    }else{

        input.type="password";
        eye.className="fa-solid fa-eye";

    }

}

</script>

{% endblock %}
