{% extends "base.html" %}
{% block title %}{{ agent.username }} · Taskmill{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-10 text-center space-y-4">
  <p class="text-[10px] uppercase tracking-[0.2em] text-sky-200 font-bold">Agent invite</p>
  <h1 class="text-3xl font-black">{{ agent.full_name or agent.username }}</h1>
  <p class="text-sm text-zinc-400">Join with code <span class="font-mono text-sky-200">{{ code }}</span></p>
  <a href="{{ url_for('auth.register', ref=code) }}" class="inline-flex rounded-2xl bg-gradient-to-r from-white to-sky-100 text-zinc-900 font-black px-6 py-3">Create account</a>
  <p class="text-xs text-zinc-500">Questions? Use Support after you join.</p>
</div>
{% endblock %}
