{% extends "base.html" %}
{% block title %}Register · Taskmill{% endblock %}
{% block content %}
<style>
  .reg-wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 1rem 0.75rem 6rem;
  }
  .reg-card {
    background: linear-gradient(165deg, rgba(30,41,59,.96), rgba(15,23,42,.94));
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 1.75rem;
    box-shadow: 0 28px 70px -32px rgba(0,0,0,.85), 0 0 60px -20px rgba(226,232,240,.16);
    position: relative;
  }
  .reg-card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(135deg, rgba(255,255,255,.45), rgba(203,213,225,.15) 40%, rgba(100,116,139,.2));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  .pt-text {
    background: linear-gradient(120deg, #fff 0%, #e2e8f0 35%, #94a3b8 60%, #f8fafc 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .pt-btn {
    background: linear-gradient(145deg, #f8fafc 0%, #e2e8f0 28%, #94a3b8 52%, #cbd5e1 78%, #f1f5f9 100%);
    color: #0f172a;
    font-weight: 800;
    box-shadow: 0 14px 32px -14px rgba(226,232,240,.5);
  }
  .pt-btn:hover { filter: brightness(1.05); }
  .pt-input {
    background: linear-gradient(180deg, rgba(0,0,0,.5), rgba(15,23,42,.65));
    border: 1px solid rgba(203,213,225,.14);
    border-radius: 1rem;
    width: 100%;
    padding: 0.85rem 1rem;
    font-size: 0.875rem;
    color: #fff;
  }
  .pt-input:focus {
    outline: none;
    border-color: rgba(226,232,240,.4);
    box-shadow: 0 0 0 3px rgba(148,163,184,.18);
  }
  .pt-label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #71717a;
    margin-bottom: 0.4rem;
  }
</style>

<div class="reg-wrap">
  <div class="text-center mb-6">
    <div class="mx-auto w-14 h-14 rounded-2xl flex items-center justify-center
                bg-gradient-to-br from-slate-100 via-slate-300 to-slate-500 shadow-lg shadow-slate-400/25">
      <i class="fa-solid fa-user-plus text-zinc-900 text-xl"></i>
    </div>
    <h1 class="mt-4 text-3xl font-black pt-text">Create account</h1>
    <p class="text-zinc-400 text-sm mt-2">Join Taskmill and start reviewing products</p>
  </div>

  <div class="reg-card p-6 sm:p-8">
    <form method="POST" action="{{ url_for('auth.register') }}" class="space-y-4 relative">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="pt-label">Full name</label>
          <input type="text" name="full_name" required class="pt-input" placeholder="Your full name">
        </div>
        <div>
          <label class="pt-label">Username</label>
          <input type="text" name="username" required class="pt-input" placeholder="Choose a username">
        </div>
      </div>

      <div>
        <label class="pt-label">Email</label>
        <input type="email" name="email" required class="pt-input" placeholder="you@email.com">
      </div>

      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="pt-label">Phone</label>
          <input type="text" name="phone" class="pt-input" placeholder="07XXXXXXXX">
        </div>
        <div>
          <label class="pt-label">Country</label>
          <select name="country" required class="pt-input">
            <option value="" disabled selected>Select country</option>
            {% for c in world_countries|default([]) %}
            <option value="{{ c }}">{{ c }}</option>
            {% else %}
            <option value="Uganda">Uganda</option>
            <option value="Kenya">Kenya</option>
            <option value="Tanzania">Tanzania</option>
            <option value="Nigeria">Nigeria</option>
            <option value="United States">United States</option>
            <option value="United Kingdom">United Kingdom</option>
            <option value="Germany">Germany</option>
            <option value="Other">Other</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="pt-label">Password</label>
          <input type="password" name="password" required minlength="6" class="pt-input" placeholder="Min 6 characters">
        </div>
        <div>
          <label class="pt-label">Confirm password</label>
          <input type="password" name="confirm_password" required minlength="6" class="pt-input" placeholder="Repeat password">
        </div>
      </div>

      <div>
        <label class="pt-label">Referral code (optional)</label>
        <input type="text" name="referral_code" value="{{ request.args.get('ref','') }}" class="pt-input" placeholder="Friend's code">
      </div>

      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="pt-label">Sex</label>
          <select name="sex" class="pt-input">
            <option value="">Prefer not to say</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>
        <div>
          <label class="pt-label">Date of birth</label>
          <input type="date" name="date_of_birth" class="pt-input" {% if max_dob %}max="{{ max_dob }}"{% endif %}>
        </div>
      </div>

      <label class="flex items-start gap-2 text-xs text-zinc-400 cursor-pointer pt-1">
        <input type="checkbox" name="accept_terms" value="1" required class="mt-0.5 rounded border-white/20 bg-zinc-900">
        <span>I agree to the <a href="{{ url_for('dashboard.terms') }}" class="text-slate-200 underline">Terms & Conditions</a></span>
      </label>

      <button type="submit" class="pt-btn w-full rounded-2xl py-3.5 text-sm mt-2">
        Create My Account
      </button>
    </form>

    <p class="text-center text-xs text-zinc-500 mt-6 relative">
      Already have an account?
      <a href="{{ url_for('auth.login') }}" class="text-slate-200 font-semibold hover:text-white">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
